name: CarMate CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Build & E2E Security Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      NODE_ENV: test
      PORT: 5173
      JWT_SECRET: ci_test_jwt_secret_must_be_long_enough_32_chars_ok
      CARMATE_ADMIN_PASSCODE: ci_admin_secure_passcode_2026_x9
      TELEGRAM_BOT_TOKEN: mock_telegram_bot_token_ci_test
      TELEGRAM_LOG_CHAT_ID: mock_chat_123

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Lint (ESLint)
        run: npm run lint

      - name: Build Web Application
        run: npm run build

      - name: Start Server, Wait for Readiness & Run E2E Suite
        env:
          # Bỏ Vite dev middleware (phục vụ bản dist đã build) nhưng GIỮ NODE_ENV=test,
          # vì rate limit của production (20 bài/10 phút) sẽ chặn chính bộ test.
          DISABLE_VITE_DEV: 'true'
        run: |
          set -e
          # Server phải chạy CÙNG step với test: mỗi step của Actions là một shell riêng,
          # tiến trình nền khởi động ở step trước sẽ bị kết thúc khi step đó đóng lại.
          node apps/api/src/index.js > server.log 2>&1 &
          SERVER_PID=$!
          echo $SERVER_PID > server.pid

          for i in $(seq 1 30); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "::error::Server process died during startup."
              cat server.log
              exit 1
            fi
            if curl -sf http://localhost:5173/api/health > /dev/null; then
              echo "Server is healthy and ready!"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::Server failed to become ready within 30s."
              cat server.log
              exit 1
            fi
            sleep 1
          done

          npm test

      - name: Verify Production Fail-Closed (Security Assurance)
        run: |
          set -u
          # Bọc `timeout` quanh mỗi lần thử: nếu server KHÔNG fail-closed nó sẽ
          # khởi động và chạy mãi, khiến step treo tới hết timeout của job.
          # Dùng .env.ci rỗng để chặn cơ chế tự nạp .env của index.js làm nhiễu
          # phép thử (nó điền lại biến bị bỏ trống từ file .env nếu có).
          check_fail_closed() {
            local label="$1"; shift
            local out
            out=$(timeout 20s env "$@" node apps/api/src/index.js 2>&1 || true)
            if printf '%s' "$out" | grep -q "FATAL SECURITY ERROR"; then
              echo "PASS: $label"
            else
              echo "::error::FAIL: $label — server không fail-closed."
              printf '%s\n' "$out" | head -20
              exit 1
            fi
          }

          # Case 1: Thiếu CARMATE_ADMIN_PASSCODE trong production -> phải fail-closed
          check_fail_closed "Chặn khởi động khi thiếu CARMATE_ADMIN_PASSCODE" \
            PORT=5993 NODE_ENV=production \
            JWT_SECRET=test_secret_32_chars_long_ci_ok \
            CARMATE_ADMIN_PASSCODE=

          # Case 2: Thiếu JWT_SECRET trong production -> phải fail-closed
          check_fail_closed "Chặn khởi động khi thiếu JWT_SECRET" \
            PORT=5994 NODE_ENV=production \
            JWT_SECRET= \
            CARMATE_ADMIN_PASSCODE=ci_prod_passcode_min_16_chars

          # Case 3: Passcode production quá ngắn -> phải fail-closed
          check_fail_closed "Chặn khởi động khi CARMATE_ADMIN_PASSCODE quá ngắn" \
            PORT=5995 NODE_ENV=production \
            JWT_SECRET=test_secret_32_chars_long_ci_ok \
            CARMATE_ADMIN_PASSCODE=short123

      - name: Stop Server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) 2>/dev/null || true
          fi

  deploy:
    name: Deploy to Fly.io (Production)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Chỉ deploy khi đẩy trực tiếp lên main (không deploy từ pull_request,
    # vì PR từ fork không có quyền đọc secret và code chưa được review xong).
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # Cổng an toàn: job test phải xanh hoàn toàn mới được deploy production.
    needs: test

    # Chặn hai lần deploy chạy song song — app dùng SQLite trên một volume,
    # hai tiến trình deploy đồng thời có thể làm hỏng dữ liệu.
    concurrency:
      group: fly-deploy-production
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify Production Health
        run: |
          set -e
          echo "Chờ ứng dụng phục vụ trở lại sau khi deploy..."
          for i in $(seq 1 30); do
            if curl -sf https://carmate.fly.dev/api/health > /dev/null; then
              echo "Production đã sẵn sàng."
              curl -s https://carmate.fly.dev/api/health
              exit 0
            fi
            sleep 5
          done
          echo "::error::Production không phản hồi /api/health sau 150 giây."
          exit 1

      - name: Verify PII Masking on Production (Nghị định 13/2023)
        run: |
          set -e
          # Chốt chặn hồi quy: sàn công khai và AI concierge tuyệt đối không
          # được trả về số điện thoại thật của thành viên.
          echo "Kiểm tra sàn công khai /api/trips..."
          if curl -s "https://carmate.fly.dev/api/trips?limit=20" | grep -q '"phoneReal"'; then
            echo "::error::PII LEAK — /api/trips trả về phoneReal trên production!"
            exit 1
          fi

          echo "Kiểm tra Sàn Giao Dịch Ghế Trống /api/seat-exchange/order-book..."
          # Sổ lệnh công khai phải đi qua sanitizeOrderForPublic: chỉ được lộ
          # phoneMasked (090***7666) và bí danh, TUYỆT ĐỐI không lộ số thật,
          # tên thật hay mã PIN đón khách.
          ORDER_BOOK=$(curl -s "https://carmate.fly.dev/api/seat-exchange/order-book")
          for FIELD in '"phone"' '"phoneReal"' '"pinCode"' '"contactName"'; do
            if printf '%s' "$ORDER_BOOK" | grep -q "$FIELD"; then
              echo "::error::PII LEAK — /api/seat-exchange/order-book trả về $FIELD trên production!"
              exit 1
            fi
          done

          echo "Kiểm tra AI concierge /api/agent/chat..."
          if curl -s -X POST https://carmate.fly.dev/api/agent/chat \
               -H 'Content-Type: application/json' \
               -d '{"message":"tìm xe từ Bình Phước về Sài Gòn"}' | grep -q '"phoneReal"'; then
            echo "::error::PII LEAK — /api/agent/chat trả về phoneReal trên production!"
            exit 1
          fi

          echo "PASS: Không phát hiện rò rỉ số điện thoại thật trên production."
