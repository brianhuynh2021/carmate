name: CarMate CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Build & E2E Security Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      NODE_ENV: test
      PORT: 5173
      JWT_SECRET: ci_test_jwt_secret_must_be_long_enough_32_chars_ok
      CARMATE_ADMIN_PASSCODE: ci_admin_secure_passcode_2026_x9

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Lint (ESLint)
        run: npm run lint

      - name: Build Web Application
        run: npm run build

      - name: Start Server, Wait for Readiness & Run E2E Suite
        env:
          # Bỏ Vite dev middleware (phục vụ bản dist đã build) nhưng GIỮ NODE_ENV=test,
          # vì rate limit của production (20 bài/10 phút) sẽ chặn chính bộ test.
          DISABLE_VITE_DEV: 'true'
        run: |
          set -e
          # Server phải chạy CÙNG step với test: mỗi step của Actions là một shell riêng,
          # tiến trình nền khởi động ở step trước sẽ bị kết thúc khi step đó đóng lại.
          node apps/api/src/index.js > server.log 2>&1 &
          SERVER_PID=$!
          echo $SERVER_PID > server.pid

          for i in $(seq 1 30); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "::error::Server process died during startup."
              cat server.log
              exit 1
            fi
            if curl -sf http://localhost:5173/api/health > /dev/null; then
              echo "Server is healthy and ready!"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::Server failed to become ready within 30s."
              cat server.log
              exit 1
            fi
            sleep 1
          done

          npm test

      - name: Verify Production Fail-Closed (Security Assurance)
        run: |
          echo "Verifying server refuses to start in production without CARMATE_ADMIN_PASSCODE or JWT_SECRET..."
          # Case 1: Thiếu CARMATE_ADMIN_PASSCODE trong production -> Phải fail-closed
          if PORT=5993 NODE_ENV=production JWT_SECRET=test_secret_32_chars_long_ci_ok CARMATE_ADMIN_PASSCODE="" node apps/api/src/index.js 2>&1 | grep -q "FATAL SECURITY ERROR"; then
            echo "PASS: Server correctly failed-closed when CARMATE_ADMIN_PASSCODE was missing."
          else
            echo "FAIL: Server did not fail-closed when CARMATE_ADMIN_PASSCODE was missing!"
            exit 1
          fi

          # Case 2: Thiếu JWT_SECRET trong production -> Phải fail-closed
          if PORT=5994 NODE_ENV=production JWT_SECRET="" CARMATE_ADMIN_PASSCODE=prod_pass_123 node apps/api/src/index.js 2>&1 | grep -q "FATAL SECURITY ERROR"; then
            echo "PASS: Server correctly failed-closed when JWT_SECRET was missing."
          else
            echo "FAIL: Server did not fail-closed when JWT_SECRET was missing!"
            exit 1
          fi

      - name: Stop Server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) 2>/dev/null || true
          fi
