name: CarMate CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Build & E2E Security Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      NODE_ENV: test
      PORT: 5173
      JWT_SECRET: ci_test_jwt_secret_must_be_long_enough_32_chars_ok
      CARMATE_ADMIN_PASSCODE: ci_admin_secure_passcode_2026_x9
      TELEGRAM_BOT_TOKEN: mock_telegram_bot_token_ci_test
      TELEGRAM_LOG_CHAT_ID: mock_chat_123

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Lint (ESLint)
        run: npm run lint

      - name: Build Web Application
        run: npm run build

      - name: Start Server, Wait for Readiness & Run E2E Suite
        env:
          # Skip the Vite dev middleware (serve the built dist) but KEEP NODE_ENV=test,
          # because the production rate limit (20 posts/10 minutes) would block the test suite itself.
          DISABLE_VITE_DEV: 'true'
        run: |
          set -e
          # The server must run in the SAME step as the tests: each Actions step is a separate shell,
          # and a background process started in a previous step is terminated when that step ends.
          node apps/api/src/index.js > server.log 2>&1 &
          SERVER_PID=$!
          echo $SERVER_PID > server.pid

          for i in $(seq 1 30); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "::error::Server process died during startup."
              cat server.log
              exit 1
            fi
            if curl -sf http://localhost:5173/api/health > /dev/null; then
              echo "Server is healthy and ready!"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::Server failed to become ready within 30s."
              cat server.log
              exit 1
            fi
            sleep 1
          done

          npm test

          # The pentest runs in the SAME step because it needs a live server. This suite attacks the
          # marketplace for real (overbooking seats, injecting state to extract phone numbers, overwriting tickets,
          # fabricating ghost vehicles) and exits with an error code if an exploit succeeds.
          npm run pentest

      - name: Verify Production Fail-Closed (Security Assurance)
        run: |
          set -u
          # Wrap each attempt in `timeout`: if the server does NOT fail closed it would
          # start and run forever, leaving the step hanging until the job timeout.
          # Use an empty .env.ci to stop index.js's automatic .env loading from interfering
          # with the test (it refills blanked-out variables from the .env file if one exists).
          check_fail_closed() {
            local label="$1"; shift
            local out
            out=$(timeout 20s env "$@" node apps/api/src/index.js 2>&1 || true)
            if printf '%s' "$out" | grep -q "FATAL SECURITY ERROR"; then
              echo "PASS: $label"
            else
              echo "::error::FAIL: $label — server không fail-closed."
              printf '%s\n' "$out" | head -20
              exit 1
            fi
          }

          # Case 1: CARMATE_ADMIN_PASSCODE missing in production -> must fail closed
          check_fail_closed "Chặn khởi động khi thiếu CARMATE_ADMIN_PASSCODE" \
            PORT=5993 NODE_ENV=production \
            JWT_SECRET=test_secret_32_chars_long_ci_ok \
            CARMATE_ADMIN_PASSCODE=

          # Case 2: JWT_SECRET missing in production -> must fail closed
          check_fail_closed "Chặn khởi động khi thiếu JWT_SECRET" \
            PORT=5994 NODE_ENV=production \
            JWT_SECRET= \
            CARMATE_ADMIN_PASSCODE=ci_prod_passcode_min_16_chars

          # Case 3: Production passcode too short -> must fail closed
          check_fail_closed "Chặn khởi động khi CARMATE_ADMIN_PASSCODE quá ngắn" \
            PORT=5995 NODE_ENV=production \
            JWT_SECRET=test_secret_32_chars_long_ci_ok \
            CARMATE_ADMIN_PASSCODE=short123

      - name: Stop Server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) 2>/dev/null || true
          fi

  deploy:
    name: Deploy to Fly.io (Production)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Only deploy on a direct push to main (never from pull_request,
    # since PRs from forks cannot read secrets and the code has not finished review).
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # Safety gate: the test job must be fully green before deploying to production.
    needs: test

    # Prevent two deploys from running in parallel — the app uses SQLite on a single volume,
    # and two simultaneous deploy processes could corrupt the data.
    concurrency:
      group: fly-deploy-production
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify Production Health
        run: |
          set -e
          echo "Chờ ứng dụng phục vụ trở lại sau khi deploy..."
          for i in $(seq 1 30); do
            if curl -sf https://carmate.fly.dev/api/health > /dev/null; then
              echo "Production đã sẵn sàng."
              curl -s https://carmate.fly.dev/api/health
              exit 0
            fi
            sleep 5
          done
          echo "::error::Production không phản hồi /api/health sau 150 giây."
          exit 1

      - name: Verify PII Masking on Production (Nghị định 13/2023)
        run: |
          set -e
          # Regression guard: the public marketplace and the AI concierge must never
          # return a member's real phone number.
          echo "Kiểm tra sàn công khai /api/trips..."
          if curl -s "https://carmate.fly.dev/api/trips?limit=20" | grep -q '"phoneReal"'; then
            echo "::error::PII LEAK — /api/trips trả về phoneReal trên production!"
            exit 1
          fi

          echo "Kiểm tra Sàn Giao Dịch Ghế Trống /api/seat-exchange/order-book..."
          # The public order book must go through sanitizeOrderForPublic: it may only expose
          # phoneMasked (090***7666) and the alias, and must NEVER expose the real number,
          # real name or the passenger pickup PIN code.
          ORDER_BOOK=$(curl -s "https://carmate.fly.dev/api/seat-exchange/order-book")
          for FIELD in '"phone"' '"phoneReal"' '"pinCode"' '"contactName"'; do
            if printf '%s' "$ORDER_BOOK" | grep -q "$FIELD"; then
              echo "::error::PII LEAK — /api/seat-exchange/order-book trả về $FIELD trên production!"
              exit 1
            fi
          done

          echo "Kiểm tra Ma Trận Khung Giờ /api/corridor/time-slots..."
          # The public corridor marketplace (no auth) must never expose a real phone number
          # or a full license plate — only plateMasked and userId.
          SLOTS=$(curl -s "https://carmate.fly.dev/api/corridor/time-slots?from=hub_ql13_tan_khai&to=hub_ql13_cho_ray")
          for FIELD in '"phone"' '"phoneReal"' '"fullPlate"'; do
            if printf '%s' "$SLOTS" | grep -q "$FIELD"; then
              echo "::error::PII LEAK — /api/corridor/time-slots trả về $FIELD trên production!"
              exit 1
            fi
          done

          echo "Kiểm tra AI concierge /api/agent/chat..."
          if curl -s -X POST https://carmate.fly.dev/api/agent/chat \
               -H 'Content-Type: application/json' \
               -d '{"message":"tìm xe từ Bình Phước về Sài Gòn"}' | grep -q '"phoneReal"'; then
            echo "::error::PII LEAK — /api/agent/chat trả về phoneReal trên production!"
            exit 1
          fi

          echo "PASS: Không phát hiện rò rỉ số điện thoại thật trên production."
