<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cmBgFavicon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151d2e" />
      <stop offset="100%" stop-color="#080c16" />
    </linearGradient>
    <linearGradient id="cmGradFavicon" x1="10%" y1="50%" x2="90%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="42%" stop-color="#06b6d4" />
      <stop offset="68%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="cmGlowFavicon" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#06b6d4" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#f59e0b" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Nền Squircle Obsidian Dark chuẩn Apple / Cursor (#090D16) -->
  <rect width="100" height="100" rx="26" fill="url(#cmBgFavicon)" stroke="rgba(255,255,255,0.22)" stroke-width="2.5" />

  <!-- Dải cao tốc CM Monogram liền mạch (Car C -> Mate M) với nét đậm 10px để nổi rõ trên Tab 16px -->
  <path
    d="M 38 35 C 20 35, 13 44, 13 52 C 13 61, 20 69, 38 69 C 45 69, 49 61, 53 48 C 55 41, 58 35, 63 35 C 67 35, 70 42, 73 50 C 76 42, 79 35, 84 35 C 88 35, 90 40, 90 48 L 90 69"
    stroke="url(#cmGradFavicon)"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#cmGlowFavicon)"
  />

  <!-- Lõi laser sáng rực rỡ màu trắng để icon trên Tab trình duyệt sắc nét tuyệt đối -->
  <path
    d="M 38 35 C 20 35, 13 44, 13 52 C 13 61, 20 69, 38 69 C 45 69, 49 61, 53 48 C 55 41, 58 35, 63 35 C 67 35, 70 42, 73 50 C 76 42, 79 35, 84 35 C 88 35, 90 40, 90 48 L 90 69"
    stroke="#ffffff"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
