# CarMate — Fly.io deployment configuration
# Region: Singapore (sin) — closest to Vietnam, ~30ms latency.
#
# For the first deployment, see the guide in README section 6.

app = 'carmate'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '8080'
  # Fly's proxy sits in front, so this must be enabled for the rate limiter to read the real IP
  # from X-Forwarded-For instead of seeing every request come from one internal IP.
  TRUST_PROXY = 'true'
  # Domains allowed to call the API. Add the real domain when pointing the domain name.
  ALLOWED_ORIGINS = 'https://carmate.vn,https://www.carmate.vn,https://admin.carmate.vn,https://ops.carmate.vn,https://carmate.fly.dev'

# Persistent disk for SQLite. DO NOT remove this section — without it, data lives in the
# container's ephemeral write layer and is wiped after every deploy.
[[mounts]]
  source = 'carmate_data'
  destination = '/app/apps/api/data'

[http_service]
  internal_port = 8080
  force_https = true

  # SQLite writes to a single file on the volume: only ONE machine may run.
  # Two instances writing in parallel would corrupt the data.
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 200
    hard_limit = 250

  # Fly only routes traffic to machines that have passed the health check.
  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
